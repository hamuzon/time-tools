<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>今月 は残り 何% ? | Time tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../utils/timezone.css" />
    <script src="../utils/timezone-ja.js" defer></script>
    <script src="../utils/timezone.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="aurora-background" aria-hidden="true"></div>
    <main class="page-shell app-page month-progress-page">
      <header class="site-header">
        <a class="wordmark" href="../" data-tool-link>TIME tools</a>
        <div class="header-controls">
          <div id="tzHeaderBtn" class="tz-chip" aria-label="">
            <span class="material-symbols-outlined chip-icon" aria-hidden="true">schedule</span>
            <span id="tzHeaderName"></span>
          </div>
          <button
            id="tzSettingsBtn"
            class="settings-btn"
            type="button"
            aria-label="設定"
            title="設定"
            aria-expanded="false"
            aria-controls="tzPanel"
          >
            <span class="material-symbols-outlined" aria-hidden="true">settings</span>
          </button>
          <div id="tzPanel" class="tz-panel" role="dialog" aria-label="設定" hidden>
            <label for="tzSelect" class="panel-label">
              <span class="material-symbols-outlined panel-icon" aria-hidden="true">language</span>
              <span data-tz-label="timeZone">タイムゾーン</span>
            </label>
            <select id="tzSelect"></select>
            <div id="tzCurrentDetail" class="panel-detail"></div>
            <hr class="panel-divider" />
            <label for="langSelect" class="panel-label">
              <span class="material-symbols-outlined panel-icon" aria-hidden="true">translate</span>
              <span data-tz-label="language">言語</span>
            </label>
            <select id="langSelect">
              <option value="ja">日本語 (Japanese)</option>
              <option value="en">English</option>
            </select>
          </div>
        </div>
      </header>
      <section class="tool-panel" aria-labelledby="page-title">
        <div class="panel-heading">
          <span class="panel-icon" aria-hidden="true"><span class="material-symbols-outlined">date_range</span></span>
          <div>
            <p class="eyebrow" data-i18n="eyebrow">今月の進捗 / Month Progress</p>
            <h1 id="page-title">—</h1>
          </div>
        </div>

        <p class="progress-label" data-i18n="elapsedLabel">経過</p>
        <p class="progress-percent" role="timer" aria-live="off">
          <strong id="percent-value">0.000000</strong><span class="percent-symbol">%</span>
        </p>

        <div
          class="progress-track"
          id="progress-bar"
          role="progressbar"
          aria-label="今月の経過"
          title="今月の経過"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="progress-fill" id="progress-fill"></div>
        </div>

        <p class="progress-countdown">
          <span data-i18n="untilEnd">終了まで</span>
          <strong id="countdown-value">—</strong>
        </p>

        <p class="completion-message" id="completion-message" role="status" aria-live="polite" hidden></p>

        <p class="progress-note" id="period-note"></p>
      </section>
      <footer class="copyright app-copyright">
        <div id="footer-copy"></div>
      </footer>
    </main>
  </body>
</html>
