<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d8b8ef" />
    <title>世界時計 | Time Tools</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="aurora-background" aria-hidden="true"></div>
    <main class="page-shell app-page world-clock-page">
      <header class="site-header">
        <a class="wordmark" href="../" data-tool-link>TIME tools</a>
      </header>
      <section class="tool-panel" aria-labelledby="page-title">
        <div class="panel-heading">
          <span class="panel-icon" aria-hidden="true">🌍</span>
          <div>
            <p class="eyebrow">WORLD CLOCK</p>
            <h1 id="page-title" data-i18n="title">世界時計</h1>
          </div>
        </div>
        <div class="local-clock">
          <p class="local-clock-label">
            <span data-i18n="yourZone">あなたのタイムゾーン</span>
            <strong id="local-zone">UTC</strong>
          </p>
          <p class="local-clock-time" id="local-time">--:--:--</p>
          <p class="local-clock-date" id="local-date"></p>
        </div>
        <ul class="world-list" id="world-list" aria-label="世界の現在時刻" data-i18n-aria="listLabel"></ul>
      </section>
      <footer class="copyright app-copyright">
        <div id="footer-copy"></div>
      </footer>
    </main>
  </body>
</html>
