<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>メトロノーム | Time Tools</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../script.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="aurora-background" aria-hidden="true"></div>
    <main class="page-shell app-page metronome-page">
      <header class="site-header">
        <a class="wordmark" href="../" data-tool-link>TIME tools</a>
      </header>
      <section class="tool-panel" aria-labelledby="page-title">
        <div class="panel-heading">
          <span class="panel-icon" aria-hidden="true">♩</span>
          <div>
            <p class="eyebrow">METRONOME</p>
            <h1 id="page-title" data-i18n="title">メトロノーム</h1>
          </div>
        </div>

        <div class="metronome-display" role="timer" aria-live="off">
          <div class="beat-indicators" id="beat-indicators" aria-hidden="true"></div>
          <strong id="beat-count">1 / 4</strong>
        </div>

        <div class="metronome-settings">
          <label class="setting-field bpm-field" for="bpm-slider">
            <span data-i18n="tempo">テンポ</span>
            <span class="bpm-value"><output id="bpm-value" for="bpm-slider">120</output> <span data-i18n="bpm">BPM</span></span>
            <input id="bpm-slider" type="range" min="30" max="240" value="120" />
          </label>
          <label class="setting-field" for="beats-per-bar">
            <span data-i18n="timeSignature">拍子</span>
            <select id="beats-per-bar">
              <option value="2/4">2 / 4</option>
              <option value="3/4">3 / 4</option>
              <option value="4/4" selected>4 / 4</option>
              <option value="5/4">5 / 4</option>
              <option value="6/4">6 / 4</option>
              <option value="7/4">7 / 4</option>
              <option value="3/8">3 / 8</option>
              <option value="5/8">5 / 8 (2 + 3)</option>
              <option value="6/8">6 / 8 (3 + 3)</option>
              <option value="7/8">7 / 8 (2 + 2 + 3)</option>
              <option value="9/8">9 / 8 (3 + 3 + 3)</option>
              <option value="12/8">12 / 8 (3 + 3 + 3 + 3)</option>
              <option value="custom" data-i18n="custom">カスタム</option>
            </select>
          </label>
          <label class="setting-field custom-meter-field" id="custom-meter-field" for="custom-meter" hidden>
            <span data-i18n="customCombination">組み合わせ</span>
            <input id="custom-meter" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="3+2+2" />
          </label>
        </div>

        <div class="control-row">
          <button class="control-button primary-button" id="metronome-toggle" type="button" aria-pressed="false" data-i18n="start">スタート</button>
          <button class="control-button quiet-button" id="metronome-reset" type="button" data-i18n="reset">リセット</button>
        </div>
        <p class="status-message" id="metronome-status" role="status" aria-live="polite"></p>
      </section>
      <footer class="copyright app-copyright">
        <div id="footer-copy"></div>
      </footer>
    </main>
  </body>
</html>
